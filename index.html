<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NutriCare SA</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- App Icon -->
  <link rel="icon" href="icon-192.png" type="image/png" />
</head>

<body>

  <!-- ================= Header ================= -->
  <header>
    <h1>NutriCare SA</h1>
    <p>Clinical Nutrition Reference</p>

    <!-- Install Button (Correct Placement) -->
    <button id="installBtn" hidden>
      📲 Install NutriCare SA
    </button>
  </header>

  <!-- ================= Main Content ================= -->
  <main>

    <!-- Adult Section -->
    <section id="adult">
      <h2>Adult Recommendations</h2>
      <input 
        type="text" 
        id="adultSearch" 
        placeholder="Search adult conditions..." 
      />
      <div id="adultContainer"></div>
    </section>

    <!-- Paediatric Section -->
    <section id="paediatric">
      <h2>Paediatric Recommendations</h2>
      <input 
        type="text" 
        id="paediatricSearch" 
        placeholder="Search paediatric conditions..." 
      />
      <div id="paediatricContainer"></div>
    </section>

  </main>

  <!-- ================= Footer ================= -->
  <footer class="app-footer">
    <p><strong>NutriCare SA v1.0</strong></p>
    <p>Last updated: <span id="lastUpdated"></span></p>
    <p class="disclaimer">
      For clinical reference only. Always apply professional judgement.
    </p>
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
